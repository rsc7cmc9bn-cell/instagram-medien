# Veröffentlicht fällige Einträge aus plan/zeitplan.json über die Instagram Graph API.
# Die Läufe bilden eine Kette: Jeder wartet gut fünf Stunden und stößt dann den nächsten an.
# Der stündliche Lauf ist nur das Sicherheitsnetz und startet die Kette neu, falls sie abreißt.
name: Instagram veröffentlichen
on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      modus:
        description: "test = nur Verbindung prüfen, leer = veröffentlichen"
        required: false
        default: ""
      bis:
        description: "Bis zu dieser Uhrzeit (HH:MM, Berlin) auf fällige Einträge warten"
        required: false
        default: ""
permissions:
  contents: write
  actions: write
# Getrennte Gruppen, damit ein stündlicher Lauf nie einen wartenden Kettenlauf verdrängt.
concurrency:
  group: instagram-${{ github.event_name == 'schedule' && 'stuendlich' || 'zeitfenster' }}
  cancel-in-progress: false
jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Fällige Einträge veröffentlichen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MODUS: ${{ github.event.inputs.modus }}
          BIS: ${{ github.event.inputs.bis }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "instagram-planer"
          git config user.email "actions@users.noreply.github.com"
          python3 tools/veroeffentlichen.py
